<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tamburada | Dijital İşletme Kartı</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 25px 20px 35px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 35px;
        }

        .logo span {
            color: #ff6a00;
        }

        .business {
            text-align: center;
            margin-bottom: 30px;
        }

        .business-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ff6a00;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
        }

        h1 {
            font-size: 25px;
            margin-bottom: 8px;
        }

        .location {
            color: #aaaaaa;
            font-size: 15px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .button {
            display: block;
            text-decoration: none;
            color: white;
            background: #222222;
            border: 1px solid #333333;
            padding: 17px;
            border-radius: 13px;
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            transition: 0.2s;
        }

        .button:hover {
            background: #ff6a00;
            transform: translateY(-2px);
        }

        .google {
            background: #ff6a00;
            border-color: #ff6a00;
        }

        .footer {
            text-align: center;
            margin-top: 35px;
            color: #777777;
            font-size: 13px;
        }

        .footer strong {
            color: #ff6a00;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        tamburada<span>.</span>
    </div>

    <div class="business">

        <div class="business-logo">
            S
        </div>

        <h1>SERENAY EMLAK
GAYRİMENKUL OFİSİ</h1>

        <div class="location">
            📍 Çanakkale
        </div>

    </div>

    <div class="buttons">

        <a class="button google"
           href="https://www.google.com/"
           target="_blank">
            ⭐ Google'da Yorum Yap
        </a>

        <a class="button"
           href="https://www.instagram.com/"
           target="_blank">
            📸 Instagram
        </a>

        <a class="button"
           href="https://wa.me/905555555555"
           target="_blank">
            💬 WhatsApp'tan Ulaş
        </a>

        <a class="button"
           href="https://maps.google.com/"
           target="_blank">
            📍 Konumu Aç
        </a>

    </div>

    <div class="footer">
        <strong>tamburada</strong><br>
        Dijital işletme kartı
    </div>

</div>

</body>
</html>
